<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Stream</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '');
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      #main-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }

      .telegram-btn {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, #1e88e5, #1565c0);
        padding: 10px 16px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        font-family: Arial, sans-serif;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      }

      .telegram-icon {
        width: 34px;
        height: 34px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
      }

      .telegram-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }

      /* Exact Reference Popup Modal Styles */
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .popup-box {
        background: #12141c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 32px 24px;
        width: 85%;
        max-width: 340px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        font-family: sans-serif;
      }

      .popup-logo-icon {
        width: 60px;
        height: 60px;
        background: #0088cc;
        border-radius: 16px;
        margin: 0 auto 14px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0, 136, 204, 0.4);
      }

      .popup-logo-icon svg {
        width: 32px;
        height: 32px;
        fill: #fff;
      }

      .popup-red-line {
        width: 28px;
        height: 3px;
        background: #ff2a2a;
        margin: 0 auto 16px auto;
        border-radius: 2px;
      }

      .popup-brand {
        color: #ff5c5c;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .popup-desc {
        color: #8c939e;
        font-size: 13px;
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .popup-buttons-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .popup-later-btn {
        flex: 1;
        background: #1b1e28;
        color: #8c939e;
        font-weight: 600;
        font-size: 14px;
        padding: 13px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        text-align: center;
        transition: background 0.2s;
      }

      .popup-later-btn:hover {
        background: #252936;
        color: #fff;
      }

      .popup-join-btn {
        flex: 1.4;
        display: block;
        background: #0088cc;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 13px;
        border-radius: 12px;
        text-decoration: none;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0, 136, 204, 0.4);
        transition: background 0.2s;
      }

      .popup-join-btn:hover {
        background: #009be6;
      }

      .error-msg {
        color: white;
        text-align: center;
        font-family: sans-serif;
        margin-top: 20px;
        position: absolute;
        width: 100%;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <!-- Telegram Button Section -->
    <a class="telegram-btn" href="https://t.me/+GVzLKNGz_OZlNmU1" target="_blank">
      <div class="telegram-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"></path>
        </svg>
      </div>
      <span>Join @Dillzylinks</span>
    </a>

    <!-- Custom Popup Modal (Exact Match) -->
    <div class="popup-overlay" id="popupOverlay">
      <div class="popup-box">
        <div class="popup-logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"></path>
          </svg>
        </div>
        <div class="popup-red-line"></div>
        <div class="popup-brand">DILLZY LINKS</div>
        <div class="popup-desc">Join our Telegram Channel for free live streams, match updates, and exclusive content.</div>
        <div class="popup-buttons-row">
          <button class="popup-later-btn" onclick="closePopup()">Later</button>
          <a href="https://t.me/+GVzLKNGz_OZlNmU1" target="_blank" class="popup-join-btn">Join Now →</a>
        </div>
      </div>
    </div>

    <iframe id="main-iframe" allowfullscreen="" allow="encrypted-media; fullscreen; autoplay"></iframe>

    <script>
      function closePopup() {
        document.getElementById('popupOverlay').style.display = 'none';
      }

      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const iframe = document.getElementById('main-iframe');

        if (id) {
          fetch('id.json')
            .then(res => res.json())
            .then(data => {
              const targetData = Array.isArray(data) ? data.find(item => item.id === id) : (data.iframes ? data.iframes.find(item => item.id === id) : null);
              if (targetData && targetData.iframeSrc) {
                iframe.src = targetData.iframeSrc;

                if (targetData.hit) {
                  fetch(targetData.hit).catch(() => {});
                }
              } else {
                showError("Stream not found");
              }
            })
            .catch(() => {
              showError("Error loading data");
            });
        } else {
          showError("No ID provided");
        }

        function showError(msg) {
          const h2 = document.createElement('h2');
          h2.className = 'error-msg';
          h2.innerText = msg;
          document.body.appendChild(h2);
          iframe.style.display = 'none';
          const badge = document.querySelector('.telegram-btn');
          if (badge) badge.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
