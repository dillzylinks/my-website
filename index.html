
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Stream</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '');
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }

      #main-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }

      .telegram-btn {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, #1e88e5, #1565c0);
        padding: 10px 16px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      }

      .telegram-icon {
        width: 34px;
        height: 34px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
      }

      .telegram-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }

      /* Telegram Popup */
      .popup-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 18px;
        box-sizing: border-box;
      }

      .popup-box {
        box-sizing: border-box;
        width: 100%;
        max-width: 620px;
        padding: 44px 28px 36px;
        text-align: center;
        background: linear-gradient(145deg, #111a24, #080d12);
        border: 1px solid #1d2a36;
        border-radius: 36px;
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
      }

      .popup-telegram-icon {
        width: 108px;
        height: 108px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: #29a9e8;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 28px rgba(41, 169, 232, 0.18);
      }

      .popup-telegram-icon svg {
        width: 54px;
        height: 54px;
        fill: #fff;
      }

      .popup-title {
        color: #f7f8fb;
        font-size: clamp(25px, 5vw, 36px);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 18px;
        text-transform: none;
      }

      .popup-subtitle {
        color: #8995a6;
        font-size: clamp(17px, 3.6vw, 24px);
        line-height: 1.6;
        margin: 0 auto 34px;
        max-width: 500px;
      }

      .popup-brand,
      .popup-desc {
        display: none;
      }

      .popup-actions {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .popup-join-btn,
      .popup-close {
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 12px;
        border-radius: 44px;
        font-size: 21px;
        font-weight: 700;
        text-decoration: none;
        text-transform: none;
        margin: 0;
        cursor: pointer;
      }

      .popup-join-btn {
        color: #fff;
        background: linear-gradient(110deg, #42c3f4, #168fe5);
        border: none;
        box-shadow: 0 8px 22px rgba(22, 143, 229, 0.2);
      }

      .popup-close {
        color: #929bab;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-decoration: none;
      }

      @media (max-width: 420px) {
        .popup-box {
          padding: 36px 20px 30px;
          border-radius: 30px;
        }

        .popup-telegram-icon {
          width: 108px;
          height: 108px;
          margin-bottom: 28px;
        }

        .popup-actions {
          gap: 12px;
        }

        .popup-join-btn,
        .popup-close {
          min-height: 76px;
          font-size: 18px;
        }
      }

      .error-msg {
        color: white;
        text-align: center;
        font-family: sans-serif;
        margin-top: 20px;
        position: absolute;
        width: 100%;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>

  <body>
    <!-- Telegram Button -->
    <a class="telegram-btn"
       href="https://t.me/+GVzLKNGz_OZlNmU1"
       target="_blank"
       rel="noopener noreferrer">

      <div class="telegram-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"></path>
        </svg>
      </div>

      <span>Join @Dillzylinks</span>
    </a>

    <!-- Telegram Popup -->
    <div class="popup-overlay" id="popupOverlay">
      <div class="popup-box">

        <div class="popup-telegram-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"></path>
          </svg>
        </div>

        <div class="popup-title">Join Telegram Channel</div>

        <div class="popup-subtitle">For Instant Updates &amp; Exclusive Links</div>

        <div class="popup-actions">
          <button class="popup-close" onclick="closePopup()">
            Already Joined
          </button>

          <a href="https://t.me/+GVzLKNGz_OZlNmU1"
             target="_blank"
             rel="noopener noreferrer"
             class="popup-join-btn">
            Join Now
          </a>
        </div>

      </div>
    </div>

    <!-- Stream Player -->
    <iframe
      id="main-iframe"
      allowfullscreen
      allow="encrypted-media; fullscreen; autoplay">
    </iframe>

    <script>
      function closePopup() {
        document.getElementById('popupOverlay').style.display = 'none';
      }

      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const iframe = document.getElementById('main-iframe');

        if (id) {
          fetch('id.json')
            .then(res => res.json())
            .then(data => {
              const targetData = Array.isArray(data)
                ? data.find(item => item.id === id)
                : (data.iframes
                    ? data.iframes.find(item => item.id === id)
                    : null);

              if (targetData && targetData.iframeSrc) {
                iframe.src = targetData.iframeSrc;

                if (targetData.hit) {
                  fetch(targetData.hit).catch(() => {});
                }
              } else {
                showError('Stream not found');
              }
            })
            .catch(() => {
              showError('Error loading data');
            });
        } else {
          showError('No ID provided');
        }

        function showError(msg) {
          const h2 = document.createElement('h2');
          h2.className = 'error-msg';
          h2.innerText = msg;
          document.body.appendChild(h2);
          iframe.style.display = 'none';

          const badge = document.querySelector('.telegram-btn');
          if (badge) badge.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
