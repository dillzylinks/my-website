<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Stream</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '');
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }

      #main-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }

      .telegram-btn {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, #1e88e5, #1565c0);
        padding: 10px 16px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      }

      .telegram-icon {
        width: 34px;
        height: 34px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
      }

      .telegram-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }

      /* Custom Popup Modal Styles */
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .popup-box {
        background: #16181c;
        border: 2px solid #1e88e5;
        border-radius: 16px;
        padding: 30px 20px;
        width: 85%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }

      .popup-title {
        color: #1e88e5;
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .popup-subtitle {
        color: #b0b0b0;
        font-size: 14px;
        margin-bottom: 8px;
      }

      .popup-brand {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .popup-desc {
        color: #999999;
        font-size: 12px;
        margin-bottom: 24px;
      }

      .popup-join-btn {
        display: block;
        background: linear-gradient(135deg, #1e88e5, #1565c0);
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        padding: 12px;
        border-radius: 8px;
        text-decoration: none;
        text-transform: uppercase;
        margin-bottom: 15px;
        box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
      }

      .popup-close {
        color: #777777;
        font-size: 13px;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: underline;
      }

      .error-msg {
        color: white;
        text-align: center;
        font-family: sans-serif;
        margin-top: 20px;
        position: absolute;
        width: 100%;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <!-- Telegram Button Section -->
    <a class="telegram-btn" href="https://t.me/dillzy_links" target="_blank">
      <div class="telegram-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"></path>
        </svg>
      </div>
      <span>Join @Dillzylinks</span>
    </a>

    <!-- Custom Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
      <div class="popup-box">
        <div class="popup-title">Join Us !!</div>
        <div class="popup-subtitle">Join our telegram channel</div>
        <div class="popup-brand">DILLZY LINKS</div>
        <div class="popup-desc">For Instant Updates &amp; Exclusive Links.</div>
        <a href="https://t.me/dillzy_links" target="_blank" class="popup-join-btn">JOIN NOW</a>
        <button class="popup-close" onclick="closePopup()">No, Thanks</button>
      </div>
    </div>

    <iframe id="main-iframe" allowfullscreen="" allow="encrypted-media; fullscreen; autoplay"></iframe>

    <script>
      function closePopup() {
        document.getElementById('popupOverlay').style.display = 'none';
      }

      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const iframe = document.getElementById('main-iframe');

        if (id) {
          fetch('id.json')
            .then(res => res.json())
            .then(data => {
              // Direct array output search
              const targetData = Array.isArray(data) ? data.find(item => item.id === id) : (data.iframes ? data.iframes.find(item => item.id === id) : null);
              if (targetData && targetData.iframeSrc) {
                iframe.src = targetData.iframeSrc;

                if (targetData.hit) {
                  fetch(targetData.hit).catch(() => {});
                }
              } else {
                showError("Stream not found");
              }
            })
            .catch(() => {
              showError("Error loading data");
            });
        } else {
          showError("No ID provided");
        }

        function showError(msg) {
          const h2 = document.createElement('h2');
          h2.className = 'error-msg';
          h2.innerText = msg;
          document.body.appendChild(h2);
          iframe.style.display = 'none';
          const badge = document.querySelector('.telegram-btn');
          if (badge) badge.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
