<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DILLZY LINKS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <!-- Shaka Player CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.4/shaka-player.compiled.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
        }

        /* Telegram Floating Button */
        .telegram-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            padding: 10px 16px;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        }
        .telegram-icon {
            width: 34px;
            height: 34px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }
        .telegram-icon svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* Custom Popup Modal */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .popup-box {
            background: #16181c;
            border: 2px solid #ffcc00;
            border-radius: 16px;
            padding: 30px 20px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .popup-title {
            color: #ffcc00;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .popup-subtitle {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .popup-brand {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .popup-desc {
            color: #999999;
            font-size: 12px;
            margin-bottom: 24px;
        }
        .popup-join-btn {
            display: block;
            background: #ffcc00;
            color: #000;
            font-weight: 700;
            font-size: 15px;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            text-transform: uppercase;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .popup-close {
            color: #777777;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Offline / Error Text */
        .offline-text {
            font-size: clamp(24px, 5vw, 60px);
            font-weight: 600;
            letter-spacing: 3px;
            color: #bfbfbf;
            text-transform: uppercase;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: none;
            text-shadow: 0 0 10px rgba(191, 191, 191, 0.3);
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Telegram Top Left Button -->
    <a href="https://t.me/+GVzLKNGz_OZlNmU1" target="_blank" class="telegram-btn">
        <div class="telegram-icon">
            <svg viewBox="0 0 24 24">
                <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"></path>
            </svg>
        </div>
        <span>Join Telegram</span>
    </a>

    <!-- Custom Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <div class="popup-title">Join Us !!</div>
            <div class="popup-subtitle">Join our telegram channel</div>
            <div class="popup-brand">DILLZY LINKS</div>
            <div class="popup-desc">For Instant Updates & Exclusive Links.</div>
            <a href="https://t.me/+GVzLKNGz_OZlNmU1" target="_blank" class="popup-join-btn">JOIN NOW</a>
            <button class="popup-close" onclick="closePopup()">No, Thanks</button>
        </div>
    </div>

    <div class="player-container">
        <div class="offline-text" id="offlineText">STREAM OFFLINE !!</div>
        <!-- Shaka Player Video Element -->
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <script>
        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const video = document.getElementById('videoPlayer');
            const offlineText = document.getElementById('offlineText');

            if (!id) {
                video.style.display = 'none';
                offlineText.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('id.json');
                const data = await res.json();
                const targetData = Array.isArray(data) 
                    ? data.find(item => item.id === id) 
                    : (data.iframes ? data.iframes.find(item => item.id === id) : null);

                if (!targetData) {
                    video.style.display = 'none';
                    offlineText.style.display = 'block';
                    return;
                }

                const streamUrl = targetData.stream_url || targetData.iframeSrc || targetData.url;

                if (!streamUrl) {
                    video.style.display = 'none';
                    offlineText.style.display = 'block';
                    return;
                }

                if (shaka.Player.isBrowserSupported()) {
                    const player = new shaka.Player(video);

                    // DRM ClearKeys Configure karna
                    const clearKeys = {};
                    if (targetData.sonuxs && Array.isArray(targetData.sonuxs)) {
                        targetData.sonuxs.forEach(pair => {
                            const [kId, kVal] = pair.split(':');
                            if (kId && kVal) {
                                clearKeys[kId] = kVal;
                            }
                        });
                    } else if (targetData.key_id && targetData.key) {
                        clearKeys[targetData.key_id] = targetData.key;
                    }

                    if (Object.keys(clearKeys).length > 0) {
                        player.configure({
                            drm: {
                                clearKeys: clearKeys
                            }
                        });
                    }

                    // Cookie Request Filter Pass karna
                    if (targetData.cookie) {
                        player.getNetworkingEngine().registerRequestFilter((type, request) => {
                            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
                                type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                                request.headers['Cookie'] = targetData.cookie;
                            }
                        });
                    }

                    try {
                        await player.load(streamUrl);
                        console.log('Stream loaded successfully!');
                    } catch (e) {
                        console.error('Error loading stream', e);
                        video.style.display = 'none';
                        offlineText.style.display = 'block';
                    }
                } else {
                    console.error('Browser not supported');
                }
            } catch (err) {
                console.error("Error fetching or parsing id.json", err);
                video.style.display = 'none';
                offlineText.style.display = 'block';
            }
        });
    </script>
</body>
</html>
